<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторне заняття 16: Події та DOM</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        section { border-bottom: 2px solid #ccc; padding: 20px 0; }
        .box { width: 100px; height: 100px; border: 1px solid black; display: inline-block; margin: 10px; background-color: green; }
        img { cursor: pointer; margin: 5px; border: 1px solid #ddd; }
        p { cursor: pointer; background: #eee; width: fit-content; padding: 5px; }
    </style>
</head>
<body>
    <h1>Динамічні сторінки та події</h1>

    <section>
        <h3>1. Клік по картинці (вивід width)</h3>
        <img src="https://via.placeholder.com/300x300/FF0000/FFFFFF?text=Картинка+1" width="300" height="300" class="task-img">
        <img src="https://via.placeholder.com/300x300/00FF00/FFFFFF?text=Картинка+2" width="300" height="300" class="task-img">
        <img src="https://via.placeholder.com/300x300/0000FF/FFFFFF?text=Картинка+3" width="300" height="300" class="task-img">
    </section>

    <section>
        <h3>2. Наведення на посилання (title = href)</h3>
        <a href="https://google.com" class="task-link">Google</a> | 
        <a href="https://github.com" class="task-link">GitHub</a> | 
        <a href="https://youtube.com" class="task-link">YouTube</a>
    </section>

    <section>
        <h3>3-4. Робота з полями вводу</h3>
        <input type="text" value="Текст 1" class="task-input">
        <input type="text" value="Текст 2" class="task-input">
        <input type="text" value="Текст 3" class="task-input">
        <p id="demo">Тут з'явиться значення input...</p>
    </section>

    <section>
        <h3>5. Квадрат числа в параграфі</h3>
        <p class="num-p">2</p>
        <p class="num-p">5</p>
        <p class="num-p">10</p>
    </section>

    <section>
        <h3>6. Чергування кольору (Зелений/Червоний)</h3>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1.1: Картинки
            const images = document.querySelectorAll('.task-img');
            images.forEach(img => {
                img.onclick = function() {
                    console.log("Ширина картинки: " + this.getAttribute('width'));
                };
            });

            // 1.2: Посилання
            const links = document.querySelectorAll('.task-link');
            links.forEach(link => {
                link.addEventListener('mouseover', function() {
                    this.title = this.href;
                });
            });

            // 1.3-1.4: Inputs
            const inputs = document.querySelectorAll('.task-input');
            const demoPara = document.getElementById('demo');
            inputs.forEach(input => {
                let firstClick = true;
                input.addEventListener('click', function() {
                    demoPara.innerText = "Значення: " + this.value;
                    if (firstClick) {
                        console.log("Перший клік: " + this.value);
                        firstClick = false;
                    } else {
                        alert("Повторний клік: " + this.value);
                    }
                });
            });

            // 1.5: Параграфи з числами
            const numParagraphs = document.querySelectorAll('.num-p');
            numParagraphs.forEach(p => {
                p.onclick = function() {
                    let num = parseFloat(this.innerText);
                    if (!isNaN(num)) {
                        this.innerText = num * num;
                    }
                };
            });

            // 2: Чергування кольору
            const boxes = document.querySelectorAll('.box');
            boxes.forEach(box => {
                box.addEventListener('click', function() {
                    this.style.backgroundColor = this.style.backgroundColor === 'red' ? 'green' : 'red';
                });
            });
        });
    </script>
</body>
</html>
